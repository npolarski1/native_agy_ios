name: AntigravityMonitor
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  AntigravityCore:
    path: Packages/AntigravityCore

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  AntigravityMonitor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AntigravityMonitor
        excludes:
          - Info.plist
    dependencies:
      - package: AntigravityCore
      - target: AntigravityMonitorWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.monitor
        PRODUCT_NAME: AntigravityMonitor
        INFOPLIST_FILE: AntigravityMonitor/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_LIVE_ACTIVITIES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  AntigravityMonitorWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AntigravityMonitorWidgets
        excludes:
          - Info.plist
      - path: AntigravityMonitor/Shared
    dependencies:
      - package: AntigravityCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.monitor.widgets
        PRODUCT_NAME: AntigravityMonitorWidgets
        INFOPLIST_FILE: AntigravityMonitorWidgets/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

schemes:
  AntigravityMonitor:
    build:
      targets:
        AntigravityMonitor: all
        AntigravityMonitorWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
